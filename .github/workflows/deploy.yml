name: Deploy

# UDALOSŤ, NIE ROZVRH: CI reaguje na zmenu stavu repa.
# Git je zdroj pravdy; push je signál, že sa pravda zmenila.
on:
  push:
    branches: [staging, main]

jobs:
  deploy:
    # EFEMÉRNE PROSTREDIE: čerstvá VM, po dobehnutí sa zahodí.
    # Dôsledok: build nemôže závisieť na ničom, čo nie je v repe.
    # Ak ti to ide lokálne a na CI nie, máš skrytú závislosť na svojom stroji.
    runs-on: ubuntu-latest

    # Kroky sú reťaz — každý predpokladá výsledok predchádzajúceho.
    steps:
      # 1. PRINES KÓD. Runner nabehne prázdny, o repe nevie nič,
      #    hoci tento súbor je v ňom. Bez checkoutu neexistuje package.json.
      - uses: actions/checkout@v4

      # 2. PRIPRAV PROSTREDIE. Verziu pripíname z rovnakého dôvodu
      #    ako compatibility_date — reprodukovateľnosť.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm   # cache kľúčovaná hashom package-lock.json

      # 3. ZÁVISLOSTI. "ci" nie "install" — inštaluje presne podľa
      #    lockfilu a zlyhá pri nezhode. install by ticho upgradol
      #    a build by bol iný než tvoj lokálny.
      #    node_modules je artefakt, preto sa neverzuje, ale rekonštruuje.
      - run: npm ci

      # 4. BUILD. Zdroj (.md, .astro) → artefakt (HTML/CSS/JS v dist/).
      #    dist/ je v .gitignore: čo vieš reprodukovať, to neskladuješ.
      - run: npm run build

      - name: Verify sitemap
        run: |
          test -s dist/sitemap-index.xml
          test -s dist/sitemap-0.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('dist/sitemap-index.xml'); ET.parse('dist/sitemap-0.xml')"
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync } from 'node:fs';

          const index = readFileSync('dist/sitemap-index.xml', 'utf8');
          const sitemap = readFileSync('dist/sitemap-0.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1]);

          if (!index.includes('<loc>https://bolgac.sk/sitemap-0.xml</loc>')) {
            throw new Error('Sitemap index does not reference the generated sitemap');
          }
          if (urls.length === 0 || !urls.includes('https://bolgac.sk/blog/') || !urls.includes('https://bolgac.sk/en/blog/')) {
            throw new Error('Sitemap is missing a public Slovak or English page');
          }
          if (urls.some((url) => !url.startsWith('https://bolgac.sk/') || url.includes('workers.dev'))) {
            throw new Error('Sitemap contains a non-production URL');
          }
          for (const url of urls) {
            const pathname = new URL(url).pathname;
            const file = pathname === '/' ? 'dist/index.html' : `dist${pathname}index.html`;
            if (!existsSync(file)) {
              throw new Error(`Sitemap URL does not have a generated page: ${url}`);
            }
          }
          if (!readFileSync('dist/robots.txt', 'utf8').includes('Sitemap: https://bolgac.sk/sitemap-index.xml')) {
            throw new Error('robots.txt does not advertise the sitemap index');
          }
          EOF

      # 5. DEPLOY. Cieľ nie je tu — je vo wrangler.jsonc.
      #    YAML dodáva len credentials; čo a kam sa posiela, vie wrangler.
      #    Oddelenie: CI vie "kedy", konfigurák vie "čo".
      - uses: cloudflare/wrangler-action@v3
        with:
          # Token nikdy priamo v súbore — ten je v Gite a Git je navždy.
          # Scope: Workers Scripts Edit. Únik = prepísaný worker,
          # nie stratená doména či mailbox. Blast radius sa reže vopred.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.137.0"
          command: ${{ github.ref_name == 'main' && 'deploy --env production' || 'deploy --env staging' }}
